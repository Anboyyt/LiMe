name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

env:
  IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/lime

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 海外 runner 用官方 Go 代理和 Alpine 源，比国内镜像快
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
            APK_MIRROR=dl-cdn.alpinelinux.org
            LIME_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'edge' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 打 tag 后把版本推送到 Telegram 频道
  notify:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TG_TOKEN}" ] || [ -z "${TG_CHAT}" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID 未配置，跳过通知"
            exit 0
          fi
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          MSG=$(printf '<b>LiMe %s 已发布</b>\n\n镜像：<code>lixxh/lime:%s</code> / <code>latest</code>\n平台：linux/amd64 · linux/arm64\n升级：<code>docker compose pull && docker compose up -d</code>\n\n%s' "$TAG" "$VER" "https://github.com/${GITHUB_REPOSITORY}")
          resp=$(curl -sS --retry 3 --retry-delay 5 \
            -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            -w "\nHTTP %{http_code}") || true
          echo "$resp"
          { echo '```'; echo "$resp"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          case "$resp" in
            *'"ok":true'*) echo "Telegram 通知已发送" ;;
            *) echo "Telegram 通知失败（不影响发布）" ;;
          esac
