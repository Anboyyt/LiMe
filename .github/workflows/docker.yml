name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

env:
  IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/lime

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 海外 runner 用官方 Go 代理和 Alpine 源，比国内镜像快
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
            APK_MIRROR=dl-cdn.alpinelinux.org
            LIME_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'edge' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 打 tag 后把版本推送到 Telegram 频道
  notify:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Notify Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TG_TOKEN}" ] || [ -z "${TG_CHAT}" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID 未配置，跳过通知"
            exit 0
          fi
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"

          # 上一个 tag 到本次 tag 的提交，去掉 docs/ci/chore 这类噪音
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            CHANGES=$(git log --no-merges --pretty=format:'• %s' "${PREV}..${TAG}" \
              | grep -vE '^• (docs|ci|chore)(\(|:| )' | head -12 || true)
          else
            CHANGES=$(git log --no-merges --pretty=format:'• %s' -n 10 "$TAG" || true)
          fi
          [ -z "$CHANGES" ] && CHANGES="• 无功能变更（仅文档 / CI）"
          # 去掉 feat:/fix: 这类前缀，再按 parse_mode=HTML 转义
          CHANGES=$(printf '%s' "$CHANGES" \
            | sed -E 's/^• (feat|fix|perf|refactor)(\([^)]*\))?: /• /' \
            | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')

          MSG=$(printf '<b>LiMe %s 已发布</b>\n\n<b>本次更新</b>\n%s\n\n镜像：<code>lixxh/lime:%s</code> / <code>latest</code>\n平台：linux/amd64 · linux/arm64\n升级：<code>docker compose pull && docker compose up -d</code>\n\n%s' "$TAG" "$CHANGES" "$VER" "https://github.com/${GITHUB_REPOSITORY}")
          resp=$(curl -sS --retry 3 --retry-delay 5 \
            -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            -w "\nHTTP %{http_code}") || true
          echo "$resp"
          { echo '```'; echo "$resp"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          case "$resp" in
            *'"ok":true'*) echo "Telegram 通知已发送" ;;
            *) echo "Telegram 通知失败（不影响发布）" ;;
          esac
