name: dockerhub-overview

on:
  push:
    branches: [main]
    paths:
      - "docs/dockerhub-overview.md"
      - ".github/workflows/dockerhub-overview.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  checks: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync overview to Docker Hub
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPO: lime
          SHORT_DESC: "轻量 Jellyfin 兼容媒体服务器：网盘 STRM + 302 直连，不转码"
        run: |
          set -uo pipefail
          (
            if [ -z "${DH_USER}" ] || [ -z "${DH_TOKEN}" ]; then
              echo "DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 未配置"
              exit 0
            fi

            echo "login as ${DH_USER}"
            LOGIN=$(curl -sS -w '\n%{http_code}' -X POST "https://hub.docker.com/v2/users/login" \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"${DH_USER}\",\"password\":\"${DH_TOKEN}\"}")
            CODE=${LOGIN##*$'\n'}
            BODY=${LOGIN%$'\n'*}
            echo "login HTTP ${CODE}"
            if [ "${CODE}" != "200" ]; then
              echo "${BODY}" | head -c 300
              exit 1
            fi
            JWT=$(echo "${BODY}" | python3 -c 'import json,sys;print(json.load(sys.stdin)["token"])')
            export JWT

            python3 tools/dockerhub_sync.py "$SHORT_DESC"
          ) >/tmp/sync.log 2>&1
          code=$?
          cat /tmp/sync.log
          if [ $code -ne 0 ]; then
            tail -c 300 /tmp/sync.log >/tmp/sync.err
            exit $code
          fi

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MSG=$(tail -c 200 /tmp/sync.log 2>/dev/null | tr '\n' ' ' | tr -d '"' | cut -c1-120)
          [ -z "$MSG" ] && MSG="sync failed (no output)"
          curl -sS -X POST "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"state\":\"failure\",\"description\":\"${MSG}\",\"context\":\"dockerhub-overview\"}" >/dev/null

          PAYLOAD=$(python3 -c 'import json,sys;print(json.dumps({"name":"dockerhub-overview","head_sha":sys.argv[1],"status":"completed","conclusion":"failure","output":{"title":"sync failed","summary":open("/tmp/sync.log").read()[-3000:]}}))' "${GITHUB_SHA}")
          curl -sS -X POST "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d "${PAYLOAD}" >/dev/null

      - name: Verify
        if: success()
        run: |
          curl -fsS "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/${REPO}/" \
            | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("description",""));print("full_description bytes:",len(d.get("full_description") or ""))'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REPO: lime
