# 源码构建覆盖文件，配合根 docker-compose.yml 使用：
#
#   LIME_VERSION=$(git describe --tags --always --dirty) \
#     docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# LIME_VERSION 必须显式传入（不传会直接报错），避免又构建出 productVersion=dev
# 的镜像。本地构建产物用 lixxh/lime:local 标签，不覆盖 latest；
# 正式镜像只由 GitHub Actions 发布，两个部署目录更新时拉 latest 即可。

services:
  lime:
    build:
      context: .
      args:
        LIME_VERSION: ${LIME_VERSION:?LIME_VERSION is required, e.g. v1.0.11-local}
    image: ${LIME_IMAGE_LOCAL:-lixxh/lime:local}
