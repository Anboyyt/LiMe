# LiMe 最小部署模板
#
# 用法：
#   1. 保存为 docker-compose.yml
#   2. 把 /path/to/your/strm 改成你的 PanSave STRM 目录
#   3. docker compose up -d
#
# 媒体界面：http://<服务器IP>:886
# 运维面板：http://<服务器IP>:886/web/ （仅管理员）

services:
  lime:
    image: lixxh/lime:latest
    container_name: lime
    restart: unless-stopped
    ports:
      - "886:886"

    environment:
      TZ: Asia/Shanghai
      # 首次启动创建的管理员，登录后请改密码
      LIME_ADMIN_USER: "admin"
      LIME_ADMIN_PASSWORD: "change-me"
      # 媒体库：名称|容器内路径|类型，多个库用分号分隔
      LIME_LIBRARIES: "电影|/media/电影|movies;剧集|/media/剧集|tvshows"
      # 面板里新建库允许的根路径
      LIME_LIBRARY_ROOTS: "/media"
      # 服务端先跟掉 PanSave 一跳，直接把最终 CDN 地址交给客户端
      LIME_RESOLVE_REDIRECT: "true"
      # 【起播优化】PlaybackInfo 的 DirectStreamUrl 直接返回 CDN 直链，
      # VidHub / SenPlayer 等优先读该字段的客户端起播少一次 302 往返。
      # 依赖上面的 LIME_RESOLVE_REDIRECT，关掉解析后本项自动失效。
      LIME_PLAYBACK_DIRECT_URL: "true"
      # 数据库每日备份输出目录，默认写到 /data；放到独立挂载点更安全
      LIME_BACKUP_DIR: "/backup"

    volumes:
      - ./data:/data
      - ./backup:/backup
      - /path/to/your/strm:/media:ro
