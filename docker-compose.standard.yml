# LiMe 标准部署
#
#   docker compose up -d
#
# 只需要改两处：
#   1. LIME_ADMIN_PASSWORD
#   2. volumes 里的 STRM 目录
#
# 其余配置都有默认值，需要时再往下加（见文件末尾注释）。

services:
  lime:
    image: lixxh/lime:latest
    container_name: lime
    restart: unless-stopped
    ports:
      - "886:886"

    environment:
      TZ: Asia/Shanghai
      LIME_SERVER_NAME: "LiMe"
      LIME_ADMIN_PASSWORD: "change-me"   # 首次启动时创建，之后改密码不覆盖

      # 首次启动没有库时，会自动把 /media 下的一级目录识别成媒体库：
      # 电影 → movies，剧集/动漫/综艺/纪录片 → tvshows，其余 → mixed。
      # 想手动指定就加 LIME_LIBRARIES，格式 "名称|路径|类型;名称|路径|类型"。

      # 大库启动时不做全量扫描；小库可删掉这行
      LIME_SCAN_ON_START: "false"

    volumes:
      - ./data:/data                    # SQLite、海报缓存
      - /path/to/your/strm:/media:ro    # ← 改成你的 STRM 目录

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:886/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# ---- 按需追加，不是必须 ----
#
# 外网访问（302 改写，否则客户端会连内网 PanSave 地址）：
#   LIME_REWRITE_ENABLED: "true"
#   LIME_REWRITE_FROM: "192.168.1.100:16868"
#   LIME_REWRITE_LOCAL: "192.168.1.100:16868"
#   LIME_REWRITE_PUBLIC: "https://pansave.example.com"
#
# TMDB 刮削：
#   LIME_TMDB_API_KEY: "xxxx"
#   LIME_TMDB_PROXY: "http://192.168.1.100:7890"
#
# 其余默认值：
#   LIME_DATA_DIR=/data  LIME_ADMIN_USER=admin  每次启动不扫描
#   LIME_REALTIME_MONITOR=true  LIME_PROBE_ENABLED=true
#   LIME_SCRAPE_WORKERS=3  LIME_SCRAPE_RATE_MS=50
