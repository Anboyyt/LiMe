services:
  lime:
    # 默认直接用 Docker Hub 镜像。
    # 改了源码要本地构建（必须传版本号，产物是 lixxh/lime:local，不覆盖 latest）：
    #   LIME_VERSION=$(git describe --tags --always --dirty) \
    #     docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ${LIME_IMAGE:-lixxh/lime:latest}
    container_name: lime
    restart: unless-stopped
    ports:
      - "886:886"

    # 机器相关配置（密钥、代理、路径、SQLite/流缓存调参）放同目录 .env，
    # 由 env_file 整体注入，不再逐条写 ${LIME_X:-} 管道。
    # 面板里能改的业务设置（刮削时间、TG、备份、探测）写入数据库后优先生效，
    # 不需要也不应该在这里重复配置。
    env_file:
      - .env

    environment:
      TZ: Asia/Shanghai

      # 容器内数据目录，对应下面 ./data
      LIME_DATA_DIR: "/data"

      # 启动不自动全量扫（29 万 STRM 约 16 分钟）；
      # 日常靠实时监控 + 面板里的每日增量扫描。
      LIME_SCAN_ON_START: "false"

      # 302 前先跟一跳 PanSave → 云盘 CDN
      # 写 true 是严格模式；删掉或写 "auto" 则默认 auto（500ms 超时 + 失败回退）
      LIME_RESOLVE_REDIRECT: "true"

      # 数据库每日快照写到独立挂载点，不和库抢 vol1 空间
      LIME_BACKUP_DIR: "/backup"

      # 面板里新建库允许的根路径
      LIME_LIBRARY_ROOTS: "/strm"

    volumes:
      - ./data:/data
      # 数据库备份独立放 vol2
      - /vol2/1000/备份/lime:/backup
      # 大库（约 29 万 STRM）
      - /vol1/1000/影视:/strm:ro

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:886/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
