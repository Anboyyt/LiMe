<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LiMe</title>
  <link rel="icon" href="/Branding/logo.png">
  <link rel="stylesheet" href="/app/app.css?v=5">
</head>
<body>
  <div id="loadingBar" class="loading-bar"></div>

  <!-- 登录 -->
  <div id="login" class="login hidden">
    <form class="login-card" id="loginForm">
      <div class="logo"><img src="/Branding/logo.png" alt="LiMe"></div>
      <p class="muted">登录媒体库</p>
      <input id="luser" placeholder="用户名" autocomplete="username" required>
      <input id="lpass" type="password" placeholder="密码" autocomplete="current-password" required>
      <button class="btn primary" type="submit">登录</button>
      <p id="loginErr" class="err hidden"></p>
    </form>
  </div>

  <!-- 主界面 -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <a class="brand" href="#/"><img src="/Branding/logo.png" alt="">LiMe<span id="brandVer" class="muted"></span></a>
      <nav id="nav"></nav>
      <div class="spacer"></div>
      <input id="search" placeholder="搜索电影、剧集">
      <button id="themeBtn" class="icon-btn" title="切换亮/暗主题" aria-label="切换主题">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <a class="icon-btn" href="/web/" title="运维面板" aria-label="运维面板">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </a>
      <span id="userName" class="muted"></span>
      <button id="logout" class="icon-btn" title="退出" aria-label="退出">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v9"/><path d="M6.2 6.2a8 8 0 1 0 11.6 0"/></svg>
      </button>
    </header>
    <main id="view"></main>
  </div>

  <!-- 播放器 -->
  <div id="player" class="player hidden">
    <div class="player-box">
      <div class="player-head">
        <span id="playerTitle"></span>
        <button id="playerClose" class="icon-btn" aria-label="关闭播放器">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <video id="video" controls playsinline></video>
      <div class="player-foot">
        <div class="player-controls">
          <label>片源
            <select id="playerSrc"></select>
          </label>
          <label>倍速
            <select id="playerRate">
              <option value="0.75">0.75×</option>
              <option value="1" selected>1×</option>
              <option value="1.25">1.25×</option>
              <option value="1.5">1.5×</option>
              <option value="2">2×</option>
            </select>
          </label>
          <label>字幕
            <select id="playerSub"><option value="">关闭</option></select>
          </label>
          <span id="playerHint" class="muted"></span>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/app/app.js?v=5"></script>
</body>
</html>
