<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LiMe · 运维面板</title>
  <link rel="icon" href="/Branding/brand-icon.png">
  <link rel="stylesheet" href="style.css?v=33">
</head>
<body>
  <!-- 登录 -->
  <div id="login" class="login hidden">
    <form class="login-card" id="loginForm">
      <div class="logo"><img class="wordmark" src="/Branding/brand-wordmark.png" alt="LiMe"></div>
      <p class="tagline">媒体服务器 · 运维面板</p>
      <input id="luser" placeholder="用户名" autocomplete="username" required>
      <input id="lpass" type="password" placeholder="密码" autocomplete="current-password" required>
      <button class="primary" type="submit">登录</button>
      <p id="loginErr" class="err hidden"></p>
    </form>
  </div>

  <!-- 主界面 -->
  <div id="app" class="app hidden">
    <aside class="side">
      <div class="brand"><img class="brand-logo" src="/Branding/brand-icon.png" alt="LiMe"><div class="brand-text"><b>LiMe</b><span>运维面板</span></div></div>
      <nav id="nav">
        <a href="#/overview" data-nav="overview">概览</a>
        <a href="#/attention" data-nav="attention">待处理</a>
        <div class="nav-title">其他</div>
        <a href="#/libraries" id="navLibraries" data-nav="libraries">媒体库管理</a>
        <a href="#/history" id="navHistory" data-nav="history">播放记录</a>
        <a href="#/logs" data-nav="logs">日志</a>
        <a href="#/notify" id="navNotify" data-nav="notify">通知</a>
        <a href="#/users" id="navUsers" data-nav="users">用户</a>
        <a href="#/keys" id="navKeys" data-nav="keys">API Key</a>
        <a href="#/system" data-nav="system">系统</a>
      </nav>
      <div class="side-foot" id="sideFoot"></div>
    </aside>

    <main>
      <header class="topbar">
        <div id="crumb" class="crumb">概览</div>
        <input id="search" placeholder="搜索标题，回车">
        <button id="scanBtn" class="ghost" title="触发一次全量扫描">立即扫描</button>
        <a class="back-media" href="/" title="返回媒体库">← 返回媒体库</a>
        <span id="userName" class="muted"></span>
        <button id="themeBtn" class="ghost" title="切换亮/暗主题" aria-label="切换主题">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button id="logout" class="ghost">退出</button>
      </header>
      <section id="view"></section>
    </main>
  </div>

  <!-- 文件夹选择弹窗 -->
  <div id="dirModal" class="modal hidden">
    <div class="modal-card dir-modal-card">
      <h3>选择文件夹</h3>
      <div class="dir-current" id="dirCurrent"></div>
      <div class="dir-list" id="dirList"></div>
      <div class="modal-actions">
        <button type="button" id="dirUp">上一级</button>
        <button type="button" id="dirCancel">取消</button>
        <button type="button" id="dirPick" class="primary">选择当前文件夹</button>
      </div>
    </div>
  </div>

  <!-- 媒体库权限弹窗 -->
  <div id="libAccessModal" class="modal hidden">
    <div class="modal-card access-modal">
      <h3 id="libAccessTitle">媒体库权限</h3>
      <p class="muted" style="margin-top:0">勾选该用户可见的媒体库；全部勾选表示不限制。</p>
      <div id="libAccessList" class="access-list"></div>
      <div class="modal-actions">
        <button type="button" id="libAccessCancel">取消</button>
        <button type="button" id="libAccessSave" class="primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 设备管理弹窗 -->
  <div id="deviceModal" class="modal hidden">
    <div class="modal-card device-modal">
      <h3 id="deviceTitle">设备管理</h3>
      <p class="muted" style="margin-top:0">下线会立刻吊销该设备的登录凭据，下次打开客户端需要重新登录。</p>
      <div id="deviceList" class="device-list"></div>
      <div class="modal-actions">
        <button type="button" id="deviceClose">关闭</button>
      </div>
    </div>
  </div>

  <!-- 用户权限弹窗 -->
  <div id="userCtlModal" class="modal hidden">
    <form class="modal-card" id="userCtlForm">
      <h3 id="userCtlTitle">用户权限</h3>
      <label class="ctl-row">
        <span>同时播放数</span>
        <input id="ctlSessions" type="number" min="0" max="100" step="1" style="max-width:100px">
      </label>
      <p class="muted" style="margin:-4px 0 12px">0 表示不限制；超过上限时新起的播放会被拒绝。</p>
      <label class="ctl-row"><input id="ctlDownload" type="checkbox"><span>允许下载</span></label>
      <label class="ctl-row"><input id="ctlPlayback" type="checkbox"><span>允许播放</span></label>
      <p class="muted" style="margin:8px 0 0">关闭播放后仍然可以浏览媒体库，但拿不到播放地址。</p>
      <div class="modal-actions">
        <button type="button" id="userCtlCancel">取消</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </div>

  <!-- 密码弹窗 -->
  <div id="pwModal" class="modal hidden">
    <form class="modal-card" id="pwForm">
      <h3 id="pwTitle">修改密码</h3>
      <input id="pwCurrent" type="password" placeholder="当前密码" autocomplete="current-password">
      <input id="pwNew" type="password" placeholder="新密码" autocomplete="new-password">
      <input id="pwConfirm" type="password" placeholder="确认新密码" autocomplete="new-password">
      <p id="pwErr" class="err hidden"></p>
      <div class="modal-actions">
        <button type="button" id="pwCancel">取消</button>
        <button type="submit" class="primary">确定</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js?v=56"></script>
</body>
</html>
